<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               viewport-fit=cover">

<title>Virtual Piano Pro X</title>

<style>

/* =========================================================
   VIRTUAL PIANO PRO X
   PART 1 / 5
   UI + PIANO FOUNDATION
========================================================= */

:root {

    --bg: #090a0d;
    --panel: #111318;
    --panel2: #181b21;
    --panel3: #20242c;

    --text: #f5f7fa;
    --muted: #858b98;

    --accent: #e5252a;
    --accent-light: #ff565b;

    --green: #31d17b;
    --yellow: #f4c542;

    --white: #f8f8fa;
    --white-dark: #d9dbe0;

    --black: #17181c;
    --black-dark: #050506;

    --border: #30343d;

    --wk: clamp(42px, 4.5vw, 68px);
    --bk: calc(var(--wk) * .60);
    --wh: clamp(180px, 27vw, 260px);

    --radius: 12px;

    box-sizing: border-box;
}


/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {

    width: 100%;
    height: 100%;

    margin: 0;
    padding: 0;
}

body {

    background:
        radial-gradient(
            circle at 50% -20%,
            #292d37 0%,
            #101217 40%,
            var(--bg) 75%
        );

    color: var(--text);

    font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        sans-serif;

    display: flex;
    flex-direction: column;

    overflow: hidden;

    user-select: none;
    -webkit-user-select: none;
}


/* =========================================================
   TOP NAVIGATION
========================================================= */

.topbar {

    min-height: 68px;

    display: flex;
    align-items: center;

    gap: 14px;

    padding:
        10px
        clamp(12px, 3vw, 42px);

    background:
        rgba(10, 11, 14, .92);

    border-bottom:
        1px solid rgba(255,255,255,.07);

    backdrop-filter:
        blur(18px);

    z-index: 20;
}


/* =========================================================
   LOGO
========================================================= */

.brand {

    display: flex;
    align-items: center;

    gap: 9px;

    margin-right: 8px;

    font-size: 1.05rem;
    font-weight: 800;

    white-space: nowrap;
}

.logo {

    width: 32px;
    height: 32px;

    display: grid;
    place-items: center;

    border-radius: 9px;

    background:
        linear-gradient(
            145deg,
            var(--accent-light),
            var(--accent)
        );

    color: white;

    font-size: 16px;

    box-shadow:
        0 6px 22px
        rgba(229,37,42,.32);
}

.brand span {

    color:
        var(--accent-light);
}


/* =========================================================
   CONTROL AREA
========================================================= */

.controls {

    display: flex;

    align-items: center;

    gap: 7px;

    flex-wrap: wrap;

    flex: 1;
}


/* =========================================================
   NOTE DISPLAY
========================================================= */

.note-display {

    min-width: 68px;
    height: 38px;

    display: grid;
    place-items: center;

    padding: 0 10px;

    border:
        1px solid
        var(--border);

    border-radius: 9px;

    background:
        #0b0c0f;

    color:
        var(--muted);

    font-size: 1.05rem;
    font-weight: 700;

    font-variant-numeric:
        tabular-nums;

    box-shadow:
        inset 0 0 18px
        rgba(0,0,0,.4);
}

.note-display.on {

    color:
        white;

    border-color:
        rgba(229,37,42,.6);

    box-shadow:
        0 0 20px
        rgba(229,37,42,.18),
        inset 0 0 18px
        rgba(229,37,42,.08);
}


/* =========================================================
   SELECT / BUTTON
========================================================= */

select,
.btn {

    min-height: 36px;

    border:
        1px solid
        var(--border);

    border-radius: 8px;

    background:
        linear-gradient(
            #20242b,
            #171a20
        );

    color:
        var(--text);

    padding:
        6px 10px;

    font: inherit;
    font-size: .8rem;

    cursor: pointer;

    transition:
        .15s ease;
}

select:hover,
.btn:hover {

    border-color:
        #50545e;

    transform:
        translateY(-1px);
}

.btn:active {

    transform:
        translateY(1px);
}

.btn.active {

    background:
        linear-gradient(
            145deg,
            var(--accent-light),
            var(--accent)
        );

    border-color:
        var(--accent);

    color:
        white;

    box-shadow:
        0 5px 18px
        rgba(229,37,42,.25);
}


/* =========================================================
   SLIDER CONTROL
========================================================= */

.control {

    display: flex;
    align-items: center;

    gap: 6px;

    color:
        var(--muted);

    font-size: .7rem;

    white-space: nowrap;
}

.control input {

    width: 75px;

    accent-color:
        var(--accent);

    cursor: pointer;
}


/* =========================================================
   STATUS
========================================================= */

.status {

    display: flex;
    align-items: center;

    gap: 7px;

    margin-left: auto;

    color:
        var(--muted);

    font-size: .7rem;
}

.status-dot {

    width: 7px;
    height: 7px;

    border-radius: 50%;

    background:
        #555b66;
}

.status-dot.on {

    background:
        var(--green);

    box-shadow:
        0 0 10px
        rgba(49,209,123,.75);
}


/* =========================================================
   MAIN WORKSPACE
========================================================= */

.workspace {

    flex: 1;

    min-height: 0;

    display: flex;

    flex-direction: column;

    gap: 10px;
}


/* =========================================================
   VISUALIZER
========================================================= */

.visualizer {

    height: 92px;

    margin:
        10px
        clamp(12px,3vw,42px)
        0;

    position: relative;

    overflow: hidden;

    border:
        1px solid
        rgba(255,255,255,.07);

    border-radius:
        var(--radius);

    background:
        rgba(8,9,12,.75);

    box-shadow:
        inset 0 0 30px
        rgba(0,0,0,.45);
}

.visualizer canvas {

    width: 100%;
    height: 100%;

    display: block;
}

.visualizer-label {

    position: absolute;

    left: 12px;
    top: 8px;

    color:
        rgba(255,255,255,.38);

    font-size:
        .62rem;

    letter-spacing:
        .1em;

    text-transform:
        uppercase;

    pointer-events:
        none;
}


/* =========================================================
   PIANO WRAPPER
========================================================= */

.piano-area {

    flex: 1;

    min-height: 0;

    display: flex;

    align-items: center;
}


/* =========================================================
   PIANO BOARD
========================================================= */

.board {

    width: 100%;

    padding:
        20px
        8px
        30px;

    background:
        linear-gradient(
            #181a20,
            #0e0f13
        );

    border-top:
        4px solid
        var(--accent);

    border-bottom:
        1px solid
        #2a2d35;

    overflow-x: auto;
    overflow-y: hidden;

    touch-action:
        pan-x;

    box-shadow:
        0 -8px 30px
        rgba(0,0,0,.25),

        0 20px 45px
        rgba(0,0,0,.42);
}


/* =========================================================
   KEYS CONTAINER
========================================================= */

.keys {

    position: relative;

    height:
        var(--wh);

    margin:
        0 auto;
}


/* =========================================================
   BASE KEY
========================================================= */

.key {

    position: absolute;

    top: 0;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: flex-end;

    gap: 5px;

    border: 0;

    padding:
        0 0 10px;

    cursor: pointer;

    touch-action:
        pan-x;

    transition:
        transform .055s ease,
        box-shadow .055s ease,
        filter .1s ease;
}

.key:focus {

    outline:
        2px solid
        var(--accent);

    outline-offset:
        2px;
}


/* =========================================================
   WHITE KEY
========================================================= */

.white {

    width:
        var(--wk);

    height:
        100%;

    background:
        linear-gradient(
            180deg,
            #ffffff 0%,
            #f1f1f3 52%,
            #d9dade 100%
        );

    border-left:
        1px solid #aaadb5;

    border-right:
        1px solid #aaadb5;

    border-radius:
        0 0 9px 9px;

    z-index:
        1;

    box-shadow:
        0 7px 0 #999da5,
        0 12px 15px
        rgba(0,0,0,.48);
}

.white:hover {

    filter:
        brightness(1.04);
}

.white.active {

    transform:
        translateY(5px);

    background:
        linear-gradient(
            180deg,
            #e8e8eb,
            #cfd1d6
        );

    box-shadow:
        0 2px 0 #999da5,
        0 4px 7px
        rgba(0,0,0,.42);
}


/* =========================================================
   BLACK KEY
========================================================= */

.black {

    width:
        var(--bk);

    height:
        62%;

    background:
        linear-gradient(
            180deg,
            #3c3f47,
            #15161a 45%,
            #050506
        );

    border-radius:
        0 0 7px 7px;

    z-index:
        5;

    box-shadow:
        0 6px 0 #000,
        0 10px 13px
        rgba(0,0,0,.7),
        inset 0 -3px 4px
        rgba(255,255,255,.08);
}

.black:hover {

    filter:
        brightness(1.12);
}

.black.active {

    transform:
        translateY(4px);

    background:
        linear-gradient(
            #2c2e34,
            #08090b
        );

    box-shadow:
        0 2px 0 #000,
        0 4px 6px
        rgba(0,0,0,.65);
}


/* =========================================================
   KEY LABEL
========================================================= */

.key-label {

    min-width:
        22px;

    padding:
        3px 6px;

    border-radius:
        5px;

    background:
        rgba(0,0,0,.12);

    color:
        #303238;

    font-size:
        10px;

    font-weight:
        700;

    pointer-events:
        none;
}

.black .key-label {

    background:
        #41444c;

    color:
        #f5f5f7;
}


/* =========================================================
   FOOTER
========================================================= */

.footer {

    min-height:
        42px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    padding:
        8px 16px;

    color:
        var(--muted);

    font-size:
        .7rem;

    background:
        #0b0c0f;

    border-top:
        1px solid
        rgba(255,255,255,.05);

    text-align:
        center;
}


/* =========================================================
   START SCREEN
========================================================= */

#start {

    position:
        fixed;

    inset:
        0;

    z-index:
        100;

    display:
        flex;

    flex-direction:
        column;

    align-items:
        center;

    justify-content:
        center;

    gap:
        18px;

    border:
        0;

    color:
        white;

    background:
        radial-gradient(
            circle at center,
            #292d38,
            #07080b 70%
        );

    cursor:
        pointer;
}

.start-logo {

    width:
        86px;

    height:
        86px;

    display:
        grid;

    place-items:
        center;

    border-radius:
        23px;

    background:
        linear-gradient(
            145deg,
            var(--accent-light),
            var(--accent)
        );

    font-size:
        36px;

    box-shadow:
        0 16px 45px
        rgba(229,37,42,.3);
}

.start-title {

    font-size:
        clamp(1.8rem,5vw,3rem);

    font-weight:
        800;
}

.start-title span {

    color:
        var(--accent-light);
}

.start-button {

    padding:
        14px 36px;

    border:
        0;

    border-radius:
        12px;

    background:
        linear-gradient(
            145deg,
            var(--accent-light),
            var(--accent)
        );

    color:
        white;

    font-weight:
        700;

    box-shadow:
        0 7px 0 #94171b,
        0 15px 35px
        rgba(229,37,42,.25);
}

.start-sub {

    color:
        var(--muted);

    font-size:
        .82rem;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 800px) {

    .topbar {

        flex-wrap:
            wrap;

        min-height:
            auto;

        padding:
            8px 12px;
    }

    .brand {

        width:
            100%;
    }

    .status {

        display:
            none;
    }

    .visualizer {

        height:
            65px;

        margin-top:
            6px;
    }

    .board {

        padding-top:
            14px;
    }

}


@media (max-width: 520px) {

    .controls {

        gap:
            5px;
    }

    .control {

        font-size:
            .62rem;
    }

    .control input {

        width:
            58px;
    }

    .note-display {

        min-width:
            52px;

        height:
            34px;

        font-size:
            .9rem;
    }

    .footer {

        font-size:
            .62rem;
    }

}

</style>

</head>


<body>


<!-- =======================================================
     START SCREEN
======================================================= -->

<button id="start">

    <div class="start-logo">
        🎹
    </div>

    <div class="start-title">
        Virtual Piano
        <span>Pro X</span>
    </div>

    <div class="start-sub">
        Professional Browser Piano
    </div>

    <div class="start-button">
        Start Playing
    </div>

</button>


<!-- =======================================================
     TOP BAR
======================================================= -->

<header class="topbar">


    <div class="brand">

        <div class="logo">
            ♪
        </div>

        Virtual Piano
        <span>Pro X</span>

    </div>


    <div class="controls">


        <div
            class="note-display"
            id="now">

            —

        </div>


        <select id="instrument">

            <option value="grand">
                Grand Piano
            </option>

            <option value="epiano">
                Electric Piano
            </option>

            <option value="organ">
                Organ
            </option>

            <option value="synth">
                Synth
            </option>

        </select>


        <label class="control">

            VOL

            <input
                id="volume"
                type="range"
                min="0"
                max="1"
                step=".01"
                value=".8">

        </label>


        <label class="control">

            REV

            <input
                id="reverb"
                type="range"
                min="0"
                max="1"
                step=".01"
                value=".25">

        </label>


        <button
            class="btn"
            id="octDown">

            Oct −

        </button>


        <span id="octave">
            0
        </span>


        <button
            class="btn"
            id="octUp">

            Oct +

        </button>


        <button
            class="btn"
            id="sustain">

            Sustain

        </button>


        <button
            class="btn"
            id="record">

            ● Rec

        </button>


        <button
            class="btn"
            id="play"
            disabled>

            ▶ Play

        </button>


    </div>


    <div class="status">

        <span
            class="status-dot"
            id="audioStatus">
        </span>

        <span id="statusText">
            Ready
        </span>

    </div>

</header>


<!-- =======================================================
     WORKSPACE
======================================================= -->

<main class="workspace">


    <!-- AUDIO VISUALIZER -->

    <section class="visualizer">

        <span class="visualizer-label">
            Audio Visualizer
        </span>

        <canvas
            id="scope"
            width="900"
            height="160">
        </canvas>

    </section>


    <!-- PIANO -->

    <section class="piano-area">

        <main class="board">

            <div
                class="keys"
                id="keys">
            </div>

        </main>

    </section>


</main>


<!-- =======================================================
     FOOTER
======================================================= -->

<footer class="footer">

    ← → Change Octave
    &nbsp; • &nbsp;
    Space = Sustain
    &nbsp; • &nbsp;
    Keyboard = Play
    &nbsp; • &nbsp;
    MIDI Keyboard Supported

</footer>


<script>

(() => {

"use strict";


/* =========================================================
   BASIC HELPERS
========================================================= */

const $ = id =>
    document.getElementById(id);


/* =========================================================
   PIANO CONFIGURATION
========================================================= */

const START = 36;
const END = 96;

const CHARS =
    'zsxdcvgbhnjm' +
    'q2w3er5t6y7u' +
    'i9o0p[=]';

const NAMES = [

    'C',
    'C#',
    'D',
    'D#',
    'E',
    'F',
    'F#',
    'G',
    'G#',
    'A',
    'A#',
    'B'

];


const isBlack = midi =>
    [1,3,6,8,10]
        .includes(midi % 12);


const noteName = midi =>
    NAMES[midi % 12] +
    (Math.floor(midi / 12) - 1);


/* =========================================================
   PIANO ELEMENT STORAGE
========================================================= */

const keysEl =
    $('keys');

const nowEl =
    $('now');

const keyElements =
    new Map();


/* =========================================================
   CREATE PIANO KEYS
========================================================= */

let whiteCount = 0;


for (
    let midi = START;
    midi <= END;
    midi++
) {

    const key =
        document.createElement('button');


    key.type =
        'button';


    key.className =
        'key ' +
        (
            isBlack(midi)
                ? 'black'
                : 'white'
        );


    key.dataset.midi =
        midi;


    key.setAttribute(
        'aria-label',
        noteName(midi)
    );


    if (
        isBlack(midi)
    ) {

        key.style.left =
            `calc(
                var(--wk) * ${whiteCount}
                - var(--bk) / 2
            )`;

    }

    else {

        key.style.left =
            `calc(
                var(--wk) * ${whiteCount}
            )`;

        whiteCount++;

    }


    const label =
        document.createElement(
            'span'
        );


    label.className =
        'key-label';


    key.appendChild(
        label
    );


    keysEl.appendChild(
        key
    );


    keyElements.set(
        midi,
        key
    );

}


keysEl.style.width =
    `calc(
        var(--wk) * ${whiteCount}
    )`;


/* =========================================================
   KEYBOARD MAPPING
========================================================= */

let octaveShift = 0;

const charMap =
    new Map();


function updateKeyboardMap() {

    charMap.clear();


    const base =
        48 +
        octaveShift * 12;


    [...CHARS].forEach(
        (char, index) => {

            const midi =
                base + index;


            if (
                midi >= START &&
                midi <= END
            ) {

                charMap.set(
                    char,
                    midi
                );

            }

        }
    );


    keyElements.forEach(
        (key, midi) => {

            const index =
                midi - base;


            const char =
                index >= 0 &&
                index < CHARS.length
                    ? CHARS[index]
                    : '';


            key.querySelector(
                '.key-label'
            ).textContent =
                char.toUpperCase();

        }
    );


    $('octave').textContent =
        octaveShift > 0
            ? '+' + octaveShift
            : octaveShift;

}


updateKeyboardMap();


/* =========================================================
   OCTAVE BUTTONS
========================================================= */

$('octDown').onclick =
    () => {

        if (
            octaveShift > -1
        ) {

            octaveShift--;

            updateKeyboardMap();

        }

    };


$('octUp').onclick =
    () => {

        if (
            octaveShift < 2
        ) {

            octaveShift++;

            updateKeyboardMap();

        }

    };


/* =========================================================
   AUDIO STATE
========================================================= */

let audioContext = null;

let master = null;

let analyser = null;

let started = false;


/* =========================================================
   AUDIO INITIALIZATION
========================================================= */

function initAudio() {

    if (
        audioContext
    ) {

        return;

    }


    audioContext =
        new (
            window.AudioContext ||
            window.webkitAudioContext
        )();


    master =
        audioContext.createGain();


    analyser =
        audioContext.createAnalyser();


    analyser.fftSize =
        512;


    master.connect(
        analyser
    );


    analyser.connect(
        audioContext.destination
    );

}


/* =========================================================
   START APPLICATION
========================================================= */

$('start')
    .addEventListener(
        'click',
        async () => {

            initAudio();


            try {

                await audioContext.resume();

            }

            catch (_) {}


            started = true;


            $('start').style.display =
                'none';


            $('audioStatus')
                .classList.add('on');


            $('statusText')
                .textContent =
                'Audio Ready';

        }
    );


/* =========================================================
   PART 2 / 5
   ADVANCED AUDIO ENGINE
========================================================= */


/* =========================================================
   INSTRUMENT PRESETS
========================================================= */

const INSTRUMENTS = {

    grand: {

        name: 'Grand Piano',

        parts: [

            {
                type: 'triangle',
                multiplier: 1,
                gain: 1.00,
                detune: 0
            },

            {
                type: 'triangle',
                multiplier: 1,
                gain: 0.48,
                detune: 4
            },

            {
                type: 'sine',
                multiplier: 2,
                gain: 0.30,
                detune: 0
            },

            {
                type: 'sine',
                multiplier: 3,
                gain: 0.12,
                detune: 0
            },

            {
                type: 'sine',
                multiplier: 0.5,
                gain: 0.16,
                detune: 0
            }

        ],

        decay: 0.90,
        sustain: 0.28,

        filterStart: 9,
        filterEnd: 3,

        release: 0.45

    },


    epiano: {

        name: 'Electric Piano',

        parts: [

            {
                type: 'sine',
                multiplier: 1,
                gain: 1.00,
                detune: 0
            },

            {
                type: 'sine',
                multiplier: 2,
                gain: 0.35,
                detune: 0
            },

            {
                type: 'sine',
                multiplier: 7,
                gain: 0.07,
                detune: 0
            },

            {
                type: 'triangle',
                multiplier: 1,
                gain: 0.25,
                detune: 3
            }

        ],

        decay: 0.70,
        sustain: 0.35,

        filterStart: 5,
        filterEnd: 2.5,

        release: 0.55

    },


    organ: {

        name: 'Organ',

        parts: [

            {
                type: 'sine',
                multiplier: 1,
                gain: 0.90,
                detune: 0
            },

            {
                type: 'sine',
                multiplier: 2,

/* =========================================================
   MASTER AUDIO SETTINGS
========================================================= */

let masterGain = null;

let dryGain = null;

let wetGain = null;

let compressor = null;

let convolver = null;


/* =========================================================
   REVERB IMPULSE
========================================================= */

function createImpulseResponse(
    context,
    duration = 2.2,
    decay = 2.6
) {

    const length =
        context.sampleRate *
        duration;


    const impulse =
        context.createBuffer(
            2,
            length,
            context.sampleRate
        );


    for (
        let channel = 0;
        channel < 2;
        channel++
    ) {

        const data =
            impulse.getChannelData(
                channel
            );


        for (
            let i = 0;
            i < length;
            i++
        ) {

            const progress =
                i / length;


            const envelope =
                Math.pow(
                    1 - progress,
                    decay
                );


            data[i] =
                (
                    Math.random() * 2 - 1
                ) *
                envelope;

        }

    }


    return impulse;

}


/* =========================================================
   INITIALIZE MASTER AUDIO CHAIN
========================================================= */

function setupAudioGraph() {

    if (
        !audioContext
    ) {

        return;

    }


    if (
        masterGain
    ) {

        return;

    }


    masterGain =
        audioContext.createGain();


    dryGain =
        audioContext.createGain();


    wetGain =
        audioContext.createGain();


    compressor =
        audioContext
            .createDynamicsCompressor();


    convolver =
        audioContext
            .createConvolver();


    convolver.buffer =
        createImpulseResponse(
            audioContext,
            2.4,
            2.7
        );


    compressor.threshold.value =
        -14;


    compressor.knee.value =
        18;


    compressor.ratio.value =
        4;


    compressor.attack.value =
        0.005;


    compressor.release.value =
        0.20;


    dryGain.gain.value =
        0.85;


    wetGain.gain.value =
        0.20;


    masterGain.gain.value =
        0.8;


    dryGain.connect(
        masterGain
    );


    wetGain.connect(
        masterGain
    );


    masterGain.connect(
        compressor
    );


    compressor.connect(
        analyser
    );


    analyser.connect(
        audioContext.destination
    );

}


/* =========================================================
   UPDATE MIX
========================================================= */

function updateMix() {

    if (
        !audioContext ||
        !masterGain
    ) {

        return;

    }


    const time =
        audioContext.currentTime;


    const volume =
        Number(
            $('volume').value
        );


    const reverb =
        Number(
            $('reverb').value
        );


    masterGain.gain
        .setTargetAtTime(
            volume,
            time,
            0.02
        );


    dryGain.gain
        .setTargetAtTime(
            1 - reverb * 0.45,
            time,
            0.02
        );


    wetGain.gain
        .setTargetAtTime(
            reverb * 0.85,
            time,
            0.02
        );

}


/* =========================================================

========================================================= */

$('volume')

/* =========================================================
   VOICE STORAGE
========================================================= */

const voices =
    new Map();


/* =========================================================
   MIDI FREQUENCY
========================================================= */

function midiToFrequency(
    midi
) {

    return 440 *
        Math.pow(
            2,
            (midi - 69) / 12
        );

}


/* =========================================================
   CLAMP VALUE
========================================================= */

function clamp(
    value,
    min,
    max
) {

    return Math.min(
        max,
        Math.max(
            min,
            value
        )
    );

}


/* =========================================================
   CREATE VOICE
========================================================= */

function createVoice(
    midi,
    velocity = 0.75
) {

    if (
        !audioContext ||
        !masterGain
    ) {

        return null;

    }


    const preset =
        INSTRUMENTS[
            $('instrument').value
        ];


    const frequency =
        midiToFrequency(
            midi
        );


    const time =
        audioContext.currentTime;


    const attack =
        Number(
            $('attack')?.value ||
            0.012
        );


    const peak =
        0.05 +
        0.32 *
        clamp(
            velocity,
            0.05,
            1
        );


    const amp =
        audioContext.createGain();


    amp.gain.setValueAtTime(
        0.0001,
        time
    );


    amp.gain.linearRampToValueAtTime(
        peak,
        time + attack
    );


    amp.gain.setTargetAtTime(
        peak * preset.sustain,
        time + attack,
        preset.decay / 3
    );


    /* -----------------------------------------------------
       FILTER
    ----------------------------------------------------- */

    const filter =
        audioContext
            .createBiquadFilter();


    filter.type =
        'lowpass';


    filter.Q.value =
        0.5;


    const startFrequency =
        Math.min(
            frequency *
            preset.filterStart *
            (
                0.6 +
                velocity * 0.6
            ),
            12000
        );


    const endFrequency =
        Math.min(
            frequency *
            preset.filterEnd,
            6000
        );


    filter.frequency.setValueAtTime(
        startFrequency,
        time
    );


    filter.frequency.setTargetAtTime(
        endFrequency,
        time + 0.01,
        0.5
    );


    /* -----------------------------------------------------
       OSCILLATORS
    ----------------------------------------------------- */

    const oscillators = [];


    preset.parts.forEach(
        part => {

            const oscillator =
                audioContext
                    .createOscillator();


            const gain =
                audioContext
                    .createGain();


            oscillator.type =
                part.type;


            oscillator.frequency.value =
                frequency *
                part.multiplier;


            oscillator.detune.value =
                part.detune;


            gain.gain.value =
                part.gain /
                2.2;


            oscillator.connect(
                gain
            );


            gain.connect(
                filter
            );


            oscillator.start(
                time
            );


            oscillators.push(
                oscillator
            );

        }
    );


    /* -----------------------------------------------------
       CONNECT VOICE
    ----------------------------------------------------- */

    filter.connect(
        amp
    );


    amp.connect(
        dryGain
    );


    amp.connect(
        convolver
    );


    return {

        midi,

        velocity,

        amp,

        filter,

        oscillators,

        preset,

        startTime: time

    };

}


/* =========================================================
   NOTE ON
========================================================= */

function noteOn(
    midi,
    velocity = 0.75
) {

    if (
        !audioContext
    ) {

        return;

    }


    if (
        midi < START ||
        midi > END
    ) {

        return;

    }


    if (
        voices.has(midi)
    ) {

        noteOff(
            midi,
            0.06
        );

    }


    const voice =
        createVoice(
            midi,
            velocity
        );


    if (!voice) {

        return;

    }


    voices.set(
        midi,
        voice
    );

}


/* =========================================================
   NOTE OFF
========================================================= */

function noteOff(
    midi,
    releaseTime
) {

    const voice =
        voices.get(
            midi
        );


    if (
        !voice
    ) {

        return;

    }


    voices.delete(
        midi
    );


    const time =
        audioContext.currentTime;


    const release =
        releaseTime ??
        voice.preset.release;


    const gain =
        voice.amp.gain;


    if (
        gain.cancelAndHoldAtTime
    ) {

        gain.cancelAndHoldAtTime(
            time
        );

    }

    else {

        const current =
            gain.value;


        gain.cancelScheduledValues(
            time
        );


        gain.setValueAtTime(
            current,
            time
        );

    }


    gain.setTargetAtTime(
        0,
        time,
        release / 4
    );


    const stopTime =
        time +
        release +
        0.15;


    voice.oscillators
        .forEach(
            oscillator => {

                try {

                    oscillator.stop(
                        stopTime
                    );

                }

                catch (_) {}

            }
        );


    voice.oscillators[0]
        .onended = () => {

            try {

                voice.amp.disconnect();

            }

            catch (_) {}


            try {

                voice.filter.disconnect();

            }

            catch (_) {}

        };

}

/* =========================================================
   ANALYSER DATA
========================================================= */

const analyserData =
    new Uint8Array(
        512
    );


/* =========================================================
   VISUALIZER
========================================================= */

function drawVisualizer() {

    requestAnimationFrame(
        drawVisualizer
    );


    if (
        !analyser
    ) {

        return;

    }


    const canvas =
        $('scope');


    const context =
        canvas.getContext(
            '2d'
        );


    analyser.getByteTimeDomainData(
        analyserData
    );


    context.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    context.beginPath();


    const width =
        canvas.width;


    const height =
        canvas.height;


    for (
        let i = 0;
        i < analyserData.length;
        i++
    ) {

        const x =
            (
                i /
                (analyserData.length - 1)
            ) *
            width;


        const y =
            (
                analyserData[i] /
                255
            ) *
            height;


        if (
            i === 0
        ) {

            context.moveTo(
                x,
                y
            );

        }

        else {

            context.lineTo(
                x,
                y
            );

        }

    }


    context.strokeStyle =
        '#e5252a';


    context.lineWidth =
        2;


    context.stroke();

}


/* =========================================================
   START VISUALIZER
========================================================= */

drawVisualizer();


/* =========================================================
   POINTER VELOCITY
========================================================= */

function calculateVelocity(
    event,
    key
) {

    const rect =
        key.getBoundingClientRect();


    const relative =
        (
            event.clientY -
            rect.top
        ) /
        rect.height;


    return clamp(
        0.30 +
        relative * 0.70,
        0.25,
        1
    );

}


/* =========================================================
   POINTER STATE
========================================================= */

const pointerNotes =
    new Map();


/* =========================================================
   FIND MIDI FROM ELEMENT
========================================================= */

function midiFromElement(
    element
) {

    const key =
        element?.closest?.(
            '.key'
        );


    if (!key) {

        return null;

    }


    return Number(
        key.dataset.midi
    );

}


/* =========================================================
   POINTER DOWN
========================================================= */

keysEl.addEventListener(
    'pointerdown',
    event => {

        const midi =
            midiFromElement(
                event.target
            );


        if (
            midi === null
        ) {

            return;

        }


        if (
            event.pointerType ===
            'mouse' &&
            event.button !== 0
        ) {

            return;

        }


        event.preventDefault();


        const key =
            keyElements.get(
                midi
            );


        const velocity =
            calculateVelocity(
                event,
                key
            );


        pointerNotes.set(
            event.pointerId,
            midi
        );


        playNote(
            midi,
            velocity
        );

    }
);


/* =========================================================
   POINTER DRAG
========================================================= */

keysEl.addEventListener(
    'pointerover',
    event => {

        if (
            event.pointerType !==
            'mouse'
        ) {

            return;

        }


        if (
            !(event.buttons & 1)
        ) {

            return;

        }


        const midi =
            midiFromElement(
                event.target
            );


        if (
            midi === null
        ) {

            return;

        }


        const previous =
            pointerNotes.get(
                event.pointerId
            );


        if (
            previous === midi
        ) {

            return;

        }


        if (
            previous !== undefined
        ) {

            stopNote(
                previous
            );

        }


        pointerNotes.set(
            event.pointerId,
            midi
        );


        const key =
            keyElements.get(
                midi
            );


        const velocity =
            calculateVelocity(
                event,
                key
            );


        playNote(
            midi,
            velocity
        );

    }
);


/* =========================================================
   POINTER RELEASE
========================================================= */

function endPointer(
    event
) {

    const midi =
        pointerNotes.get(
            event.pointerId
        );


    if (
        midi === undefined
    ) {

        return;

    }


    pointerNotes.delete(
        event.pointerId
    );


    stopNote(
        midi
    );

}


window.addEventListener(
    'pointerup',
    endPointer
);


window.addEventListener(
    'pointercancel',

);

/* =========================================================
   PERFORMANCE STATE
========================================================= */

const heldKeys =
    new Map();

const sustainedNotes =
    new Set();

let sustainEnabled =
    false;

let recording =
    false;

let recordingStart =
    0;

let recordedEvents =
    [];

let playbackTimers =
    [];

let isPlaying =
    false;


/* =========================================================
   RECORDING CLOCK
========================================================= */

function recordingTime() {

    if (!recording) {

        return 0;

    }

    return performance.now() -
        recordingStart;

}


/* =========================================================
   RECORD NOTE ON
========================================================= */

function recordNoteOn(
    midi,
    velocity
) {

    if (!recording) {

        return;

    }


    recordedEvents.push({

        time:
            recordingTime(),

        midi,

        velocity,

        type:
            'on'

    });

}


/* =========================================================
   RECORD NOTE OFF
========================================================= */

function recordNoteOff(
    midi
) {

    if (!recording) {

        return;

    }


    recordedEvents.push({

        time:
            recordingTime(),

        midi,

        velocity:
            0,

        type:
            'off'

    });

}


/* =========================================================
   RECORD PEDAL
========================================================= */

function recordPedal(
    state
) {

    if (!recording) {

        return;

    }


    recordedEvents.push({

        time:
            recordingTime(),

        midi:
            0,

        velocity:
            0,

        type:
            state
                ? 'pedalOn'
                : 'pedalOff'

    });

}


/* =========================================================
   EXTENDED PLAY NOTE
========================================================= */

const originalPlayNote =
    playNote;


playNote = function (
    midi,
    velocity = 0.75,
    fromPlayback = false
) {

    originalPlayNote(
        midi,
        velocity
    );


    if (
        !fromPlayback
    ) {

        recordNoteOn(
            midi,
            velocity
        );

    }

};


/* =========================================================
   EXTENDED STOP NOTE
========================================================= */

const originalStopNote =
    stopNote;


stopNote = function (
    midi,
    fromPlayback = false
) {

    originalStopNote(
        midi
    );


    if (
        !fromPlayback
    ) {

        recordNoteOff(
            midi
        );

    }

};


/* =========================================================
   SUSTAIN PEDAL
========================================================= */

function setSustain(
    enabled
) {

    if (
        sustainEnabled ===
        enabled
    ) {

        return;

    }


    sustainEnabled =
        enabled;


    $('sustain')
        .classList.toggle(
            'active',
            enabled
        );


    recordPedal(
        enabled
    );


    if (
        !enabled
    ) {

        sustainedNotes
            .forEach(
                midi => {

                    originalStopNote(
                        midi
                    );

                }
            );


        sustainedNotes.clear();

    }

}


/* =========================================================
   RELEASE WITH SUSTAIN
========================================================= */

function releaseWithSustain(
    midi
) {

    const key =
        keyElements.get(
            midi
        );


    if (key) {

        key.classList.remove(
            'active'
        );

    }


    if (
        sustainEnabled
    ) {

        sustainedNotes.add(
            midi
        );

        if (key) {

            key.style.filter =
                'brightness(0.96)';

        }

        return;

    }


    stopNote(
        midi
    );

}

/* =========================================================
   START RECORDING
========================================================= */

function startRecording() {

    recordedEvents =
        [];


    recording =
        true;


    recordingStart =

    $('record')

        );

/* =========================================================
   STOP RECORDING
========================================================= */

function stopRecording() {

    recording =
        false;


    $('record')
        .classList.remove(
            'active'
        );


    $('record')
        .textContent =
        '● Rec';


    $('statusText')
        .textContent =
        recordedEvents.length
            ? 'Recording Ready'
            : 'Ready';


    $('play').disabled =
        recordedEvents.length === 0;

}


/* =========================================================
   CLEAN RECORDING
========================================================= */

function cleanRecording() {

    if (
        !recordedEvents.length
    ) {

        return [];

    }


    return recordedEvents
        .map(
            event => ({
                ...event
            })
        )
        .sort(
            (a, b) =>
                a.time - b.time
        );

}


/* =========================================================
   PLAYBACK
========================================================= */

$('play')
    .addEventListener(
        'click',
        () => {

            if (
                isPlaying
            ) {

                stopPlayback();

            }

            else {

                startPlayback();

            }

        }
    );


/* =========================================================
   START PLAYBACK
========================================================= */

function startPlayback() {

    if (
        !recordedEvents.length
    ) {

        return;

    }


    stopPlayback();


    const events =
        cleanRecording();


    if (
        !events.length
    ) {

        return;

    }


    isPlaying =
        true;


    $('play')
        .classList.add(
            'active'
        );


    $('play')
        .textContent =
        '■ Stop';


    $('record').disabled =
        true;


    $('statusText')
        .textContent =
        'Playing';


    events.forEach(
        event => {

            const timer =
                setTimeout(
                    () => {

                        handlePlaybackEvent(
                            event
                        );

                    },
                    event.time
                );


            playbackTimers.push(
                timer
            );

        }
    );


    const duration =
        events[
            events.length - 1
        ].time + 700;


    playbackTimers.push(

        setTimeout(
            () => {

                finishPlayback();

            },
            duration
        )

    );

}


/* =========================================================
   PLAYBACK EVENT
========================================================= */

function handlePlaybackEvent(
    event
) {

    if (
        !isPlaying
    ) {

        return;

    }


    if (
        event.type ===
        'on'
    ) {

        playNote(
            event.midi,
            event.velocity,
            true
        );

    }


    else if (
        event.type ===
        'off'
    ) {

        stopNote(
            event.midi,
            true
        );

    }


    else if (
        event.type ===
        'pedalOn'
    ) {

        sustainEnabled =
            true;

        $('sustain')
            .classList.add(
                'active'
            );

    }


    else if (
        event.type ===
        'pedalOff'
    ) {

        sustainEnabled =
            false;

        $('sustain')
            .classList.remove(
                'active'
            );

    }

}


/* =========================================================
   FINISH PLAYBACK
========================================================= */

function finishPlayback() {

    playbackTimers =
        [];


    isPlaying =
        false;


    $('play')
        .classList.remove(
            'active'
        );


    $('play')
        .textContent =
        '▶ Play';


    $('record').disabled =
        false;


    releaseEverything();


    $('statusText')
        .textContent =
        'Recording Ready';

}


/* =========================================================
   STOP PLAYBACK
========================================================= */

function stopPlayback() {

    playbackTimers
        .forEach(
            timer =>
                clearTimeout(
                    timer
                )
        );


    playbackTimers =
        [];


    isPlaying =
        false;


    releaseEverything();


    $('play')
        .classList.remove(
            'active'
        );


    $('play')
        .textContent =
        '▶ Play';


    $('record').disabled =
        false;

}


/* =========================================================
   RELEASE EVERYTHING
========================================================= */

function releaseEverything() {

    heldKeys.forEach(
        midi => {

            originalStopNote(
                midi
            );

            const key =
                keyElements.get(
                    midi
                );


            if (key) {

                key.classList.remove(
                    'active'
                );

                key.style.filter =
                    '';

            }

        }
    );


    heldKeys.clear();


    sustainedNotes.forEach(
        midi => {

            originalStopNote(
                midi
            );


            const key =
                keyElements.get(
                    midi
                );


            if (key) {

                key.classList.remove(
                    'active'
                );

                key.style.filter =
                    '';

            }

        }
    );


    sustainedNotes.clear();


    voices.forEach(
        (_, midi) => {

            originalStopNote(
                midi
            );

        }
    );


    voices.clear();


    nowEl.classList.remove(
        'on'
    );


    nowEl.textContent =
        '—';

}


/* =========================================================
   KEYBOARD INPUT
========================================================= */

window.addEventListener(
    'keydown',
    event => {

        if (
            event.ctrlKey ||
            event.metaKey ||
            event.altKey
        ) {

            return;

        }


        /* -------------------------------------------------
           SPACE = SUSTAIN
        ------------------------------------------------- */

        if (
            event.code ===
            'Space'
        ) {

            if (
                event.repeat
            ) {

                return;

            }


            event.preventDefault();


            setSustain(
                true
            );


            return;

        }


        /* -------------------------------------------------
           ARROW LEFT = OCTAVE DOWN
        ------------------------------------------------- */

        if (
            event.key ===
            'ArrowLeft'
        ) {

            if (
                event.target.tagName ===
                'INPUT'
            ) {

                return;

            }


            event.preventDefault();


            if (
                !event.repeat
            ) {

                $('octDown').click();

            }


            return;

        }


        /* -------------------------------------------------
           ARROW RIGHT = OCTAVE UP
        ------------------------------------------------- */

        if (
            event.key ===
            'ArrowRight'
        ) {

            if (
                event.target.tagName ===
                'INPUT'
            ) {

                return;

            }


            event.preventDefault();


            if (
                !event.repeat
            ) {

                $('octUp').click();

            }


            return;

        }


        /* -------------------------------------------------
           IGNORE FORM INPUTS
        ------------------------------------------------- */

        if (
            event.target.tagName ===
            'INPUT' ||
            event.target.tagName ===
            'SELECT'
        ) {

            return;

        }


        const char =
            event.key.toLowerCase();


        if (
            !charMap.has(
                char
            )
        ) {

            return;

        }


        event.preventDefault();


        if (
            event.repeat ||
            heldKeys.has(
                char
            )
        ) {

            return;

        }


        const midi =
            charMap.get(
                char
            );


        heldKeys.set(
            char,
            midi
        );


        playNote(
            midi,
            0.78
        );

    }
);


/* =========================================================
   KEYBOARD RELEASE
========================================================= */

window.addEventListener(
    'keyup',
    event => {

        /* -----------------------------------------------
           SPACE
        ----------------------------------------------- */

        if (
            event.code ===
            'Space'
        ) {

            event.preventDefault();


            setSustain(
                false
            );


            return;

        }


        const char =
            event.key.toLowerCase();


        if (
            !heldKeys.has(
                char
            )
        ) {

            return;

        }


        const midi =
            heldKeys.get(
                char
            );


        heldKeys.delete(
            char
        );


        releaseWithSustain(
            midi
        );

    }
);

    pointerNotes.delete(

}

function getRecordingStats() {

        );


    const duration =
        recordedEvents.length

                recordedEvents.length - 1

    return {

        notes:

        events:
            recordedEvents.length,

        duration:
            duration,

        seconds:
            duration / 1000

    };

}

/* =========================================================
   NOTE TIMING
========================================================= */

function beatDuration() {

    return (
        60000 /
        practiceBPM
    );

}


/* =========================================================
   PREPARE SONG
========================================================= */

function prepareSong() {

    practiceNotes =
        currentSong.notes.map(
            (note, index) => {

                return {

                    midi:
                        note.n,

                    duration:
                        note.d,

                    index,

                    time:
                        0,

                    hit:
                        false,

                    missed:
                        false

                };

            }
        );


    let accumulated =
        0;


    practiceNotes.forEach(
        note => {

            note.time =
                accumulated;


            accumulated +=
                note.duration *
                beatDuration();

        }
    );


    practiceTotal =
        practiceNotes.length;


    practiceIndex =
        0;

}

   START PRACTICE

function startPractice() {

        true;

    practicePaused =
        false;

/* =========================================================
   PRACTICE LOOP
========================================================= */

function runPracticeLoop() {

    if (
        !practiceRunning ||
        practicePaused
    ) {

        return;

    }


    const elapsed =
        performance.now() -
        practiceStartTime;


    updateFallingNotes(
        elapsed
    );


    checkMissedNotes(
        elapsed
    );


    if (
        practiceIndex >=
        practiceNotes.length
    ) {

        const last =
            practiceNotes[
                practiceNotes.length - 1
            ];


        if (
            elapsed >
            last.time +
            last.duration *
            beatDuration() +
            500
        ) {

            finishPractice();

            return;

        }

    }


    practiceAnimation =
        requestAnimationFrame(
            runPracticeLoop
        );

}


/* =========================================================
   CREATE FALLING NOTE
========================================================= */

function createFallingNote(
    note
) {

    const element =
        document.createElement(
            'div'
        );


    element.className =
        'falling-note';


    if (
        note.index ===
        practiceIndex
    ) {

        element.classList.add(
            'current'
        );

    }


    const whiteIndex =
        calculateWhiteIndex(
            note.midi
        );


    const totalWidth =
        fallingArea
            .clientWidth;


    const pianoWidth =
        keyElements.size *
        20;


    let x =
        (
            whiteIndex /
            35
        ) *
        totalWidth;


    x =
        Math.max(
            18,
            Math.min(
                totalWidth - 18,
                x
            )
        );


    element.style.left =
        `${x}px`;


    element.dataset.index =
        note.index;


    fallingNotes.appendChild(
        element
    );


    return element;

}


/* =========================================================
   CALCULATE WHITE KEY POSITION
========================================================= */

function calculateWhiteIndex(
    midi
) {

    let count =
        0;


    for (
        let m = START;
        m < midi;
        m++
    ) {

        if (
            !isBlack(m)
        ) {

            count++;

        }

    }


    return count;

}


/* =========================================================
   UPDATE FALLING NOTES
========================================================= */

function updateFallingNotes(
    elapsed
) {

    const visibleTime =
        1800;


    fallingNotes
        .querySelectorAll(
            '.falling-note'
        )
        .forEach(
            element => {

                const index =
                    Number(
                        element.dataset.index
                    );


                const note =
                    practiceNotes[
                        index
                    ];


                if (!note) {

                    element.remove();

                    return;

                }


                const distance =
                    note.time -
                    elapsed;


                const progress =
                    1 -
                    (
                        distance /
                        visibleTime
                    );


                const y =
                    progress *
                    (
                        fallingArea
                            .clientHeight -
                        30
                    );


                element.style.top =
                    `${y}px`;


                if (
                    note.hit ||
                    note.missed ||
                    y >
                    fallingArea
                        .clientHeight
                ) {

                    element.remove();

                }

            }
        );


    practiceNotes.forEach(
        note => {

            if (
                note.hit ||
                note.missed
            ) {

                return;

            }


            const distance =
                note.time -
                elapsed;


            if (
                distance <
                visibleTime &&
                distance >
                -100
            ) {

                if (
                    !fallingNotes
                        .querySelector(
                            `[data-index="${note.index}"]`
                        )
                ) {

                    createFallingNote(
                        note
                    );

                }

            }

        }
    );

}


/* =========================================================
   MISSED NOTE CHECK
========================================================= */

function checkMissedNotes(
    elapsed
) {

    practiceNotes.forEach(
        note => {

            if (
                note.hit ||
                note.missed
            ) {

                return;

            }


            if (
                elapsed >
                note.time +
                hitWindow
            ) {

                note.missed =
                    true;


                practiceMisses++;


                practiceCombo =
                    0;


                showPracticeMessage(
                    'MISS',
                    false
                );


                updatePracticeStats();

            }

        }
    );

}


/* =========================================================
   FIND NEXT NOTE
========================================================= */

function getNextPracticeNote() {

    for (
        let i = 0;
        i < practiceNotes.length;
        i++
    ) {

        const note =
            practiceNotes[i];


        if (
            !note.hit &&
            !note.missed
        ) {

            practiceIndex =
                i;

            return note;

        }

    }


    return null;

}


/* =========================================================
   PRACTICE NOTE MATCHING
========================================================= */

function checkPracticeInput(
    midi
) {

    if (
        !practiceRunning ||
        practicePaused
    ) {

        return false;

    }


    const elapsed =
        performance.now() -
        practiceStartTime;


    const note =
        getNextPracticeNote();


    if (!note) {

        return false;

    }


    const difference =
        Math.abs(
            elapsed -
            note.time
        );


    if (
        note.midi === midi &&
        difference <= hitWindow
    ) {

        registerPracticeHit(
            note,
            difference
        );


        return true;

    }


    if (
        note.midi !== midi
    ) {

        practiceCombo =
            0;


        showPracticeMessage(
            'Wrong Note',
            false
        );


        updatePracticeStats();

    }


    return false;

}


/* =========================================================
   REGISTER HIT
========================================================= */

function registerPracticeHit(
    note,
    difference
) {

    note.hit =
        true;


    practiceHits++;


    practiceCombo++;


    practiceMaxCombo =
        Math.max(
            practiceMaxCombo,
            practiceCombo
        );


    let points =
        100;


    if (
        difference <= 60
    ) {

        points =
            150;

    }

    else if (
        difference <= 110
    ) {

        points =
            125;

    }


    points +=
        Math.min(
            practiceCombo * 5,
            100
        );


    practiceScore +=
        points;


    practiceIndex =
        note.index + 1;


    showPracticeMessage(
        difference <= 60
            ? 'PERFECT!'
            : 'GOOD!',
        true
    );


    const element =
        fallingNotes.querySelector(
            `[data-index="${note.index}"]`
        );


    if (element) {

        element.remove();

    }


    updatePracticeStats();


    if (
        practiceIndex >=
        practiceNotes.length
    ) {

        setTimeout(
            finishPractice,
            250
        );

    }

}


/* =========================================================
   PRACTICE INPUT HOOK
========================================================= */

const practiceOriginalPlay =
    playNote;


playNote = function (
    midi,
    velocity = 0.75,
    fromPlayback = false
) {

    practiceOriginalPlay(
        midi,
        velocity,
        fromPlayback
    );


    if (
        practiceMode &&
        practiceRunning &&
        !fromPlayback
    ) {

        checkPracticeInput(
            midi
        );

    }

};


/* =========================================================
   ACCURACY
========================================================= */

function getPracticeAccuracy() {

    const attempts =
        practiceHits +
        practiceMisses;


    if (
        attempts === 0
    ) {

        return 100;

    }


    return Math.round(
        (
            practiceHits /
            attempts
        ) * 100
    );

}

/* =========================================================
   METRONOME TICK
========================================================= */

function tickMetronome() {

    if (
        !audioContext ||
        !started
    ) {

        return;

    }


    metronomeBeat++;


    const accent =
        metronomeBeat % 4 === 1;


    const oscillator =
        audioContext
            .createOscillator();


    const gain =
        audioContext
            .createGain();


    oscillator.type =
        'sine';


    oscillator.frequency.value =
        accent
            ? 1200
            : 850;


    const time =
        audioContext.currentTime;


    gain.gain.setValueAtTime(
        .0001,
        time
    );


    gain.gain.exponentialRampToValueAtTime(
        accent
            ? .18
            : .10,
        time + .005
    );


    gain.gain.exponentialRampToValueAtTime(
        .0001,
        time + .08
    );


    oscillator.connect(
        gain
    );


    gain.connect(
        masterGain
    );


    oscillator.start(
        time
    );


    oscillator.stop(
        time + .1
    );

}

   STOP METRONOME
========================================================= */

        metronomeTimer
    ) {

}

/* =========================================================
   CHORD NAMES
========================================================= */

const CHORD_PATTERNS = [

    {
        name: '',
        intervals: [0,4,7]
    },

    {
        name: 'm',
        intervals: [0,3,7]
    },

    {
        name: 'dim',
        intervals: [0,3,6]
    },

    {
        name: 'aug',
        intervals: [0,4,8]
    },

    {
        name: 'sus2',
        intervals: [0,2,7]
    },

    {
        name: 'sus4',
        intervals: [0,5,7]
    },

    {
        name: '7',
        intervals: [0,4,7,10]
    },

    {
        name: 'maj7',
        intervals: [0,4,7,11]
    },

    {
        name: 'm7',
        intervals: [0,3,7,10]
    }

];


/* =========================================================
   DETECT CHORD
========================================================= */

function detectChord() {

    if (
        activeNotes.size <
        3
    ) {

        detectedChord =
            '';


        updateChordDisplay();


        return;

    }


    const notes =
        [...activeNotes]
            .sort(
                (a,b) =>
                    a - b
            );


    const uniqueClasses =
        [...new Set(
            notes.map(
                midi =>
                    midi % 12
            )
        )];


    let bestMatch =
        null;


    for (
        const root of uniqueClasses
    ) {

        const intervals =
            uniqueClasses
                .map(
                    note =>
                        (
                            note -
                            root +
                            12
                        ) % 12
                )
                .sort(
                    (a,b) =>
                        a - b
                );


        for (
            const pattern
            of CHORD_PATTERNS
        ) {

            if (
                arraysEqual(
                    intervals,
                    pattern.intervals
                )
            ) {

                bestMatch = {

                    root,

                    suffix:
                        pattern.name

                };


                break;

            }

        }


        if (
            bestMatch
        ) {

            break;

        }

    }


    if (
        bestMatch
    ) {

        detectedChord =
            NAMES[
                bestMatch.root
            ] +
            bestMatch.suffix;

    }

    else {

        detectedChord =
            'Unknown';

    }


    updateChordDisplay();

}


/* =========================================================
   ARRAY COMPARISON
========================================================= */

function arraysEqual(
    a,
    b
) {

    if (
        a.length !==
        b.length
    ) {

        return false;

    }


    for (
        let i = 0;
        i < a.length;
        i++
    ) {

        if (
            a[i] !==
            b[i]
        ) {

            return false;

        }

    }


    return true;

}
