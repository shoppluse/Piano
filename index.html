                if (
                    data.instrument &&
                    INSTRUMENTS[
                        data.instrument
                    ]
                ) {

                    $('instrument')
                        .value =
                        data.instrument;

                }


                if (
                    data.bpm
                ) {

                    practiceBPM =
                        data.bpm;

                    practiceBPMInput.value =
                        data.bpm;

                    practiceBPMValue.textContent =
                        data.bpm;

                }


                $('play').disabled =
                    false;


                updateRecordingStatus();


                updatePerformanceStats();


                showFlash(
                    'Recording Imported ✓'
                );

            }

            catch (_) {

                showFlash(
                    'Import failed'
                );

            }


            event.target.value =
                '';

        }
    );


/* =========================================================
   FULLSCREEN
========================================================= */

$('fullscreen')
    .addEventListener(
        'click',
        async () => {

            try {

                if (
                    !document.fullscreenElement
                ) {

                    await document
                        .documentElement
                        .requestFullscreen();


                    fullscreenEnabled =
                        true;


                    $('fullscreen')
                        .textContent =
                        '⛶ Exit';

                }

                else {

                    await document
                        .exitFullscreen();


                    fullscreenEnabled =
                        false;


                    $('fullscreen')
                        .textContent =
                        '⛶ Fullscreen';

                }

            }

            catch (_) {

                showFlash(
                    'Fullscreen unavailable'
                );

            }

        }
    );


/* =========================================================
   FULLSCREEN STATE
========================================================= */

document.addEventListener(
    'fullscreenchange',
    () => {

        fullscreenEnabled =
            Boolean(
                document.fullscreenElement
            );


        $('fullscreen')
            .textContent =
            fullscreenEnabled
                ? '⛶ Exit'
                : '⛶ Fullscreen';

    }
);


/* =========================================================
   PANIC BUTTON
========================================================= */

$('panic')
    .addEventListener(
        'click',
        () => {

            panicStop();

        }
    );


/* =========================================================
   PANIC STOP
========================================================= */

function panicStop() {

    stopPlayback();


    stopMetronome();


    metronomeEnabled =
        false;


    $('metronome')
        .classList.remove(
            'active'
        );


    releaseEverything();


    activeNotes.clear();


    detectedChord =
        '';


    updateChordDisplay();


    showFlash(
        'All Notes Stopped'
    );

}


/* =========================================================
   SAVE SETTINGS
========================================================= */

function saveSettings() {

    const settings = {

        instrument:
            $('instrument').value,

        volume:
            $('volume').value,

        reverb:
            $('reverb').value,

        octave:
            octaveShift,

        bpm:
            practiceBPM

    };


    localStorage.setItem(
        'virtualPianoSettings',
        JSON.stringify(
            settings
        )
    );

}


/* =========================================================
   LOAD SETTINGS
========================================================= */

function loadSettings() {

    const raw =
        localStorage.getItem(
            'virtualPianoSettings'
        );


    if (!raw) {

        return;

    }


    try {

        const settings =
            JSON.parse(
                raw
            );


        if (
            settings.instrument &&
            INSTRUMENTS[
                settings.instrument
            ]
        ) {

            $('instrument')
                .value =
                settings.instrument;

        }


        if (
            settings.volume !==
            undefined
        ) {

            $('volume')
                .value =
                settings.volume;

        }


        if (
            settings.reverb !==
            undefined
        ) {

            $('reverb')
                .value =
                settings.reverb;

        }


        if (
            typeof settings.octave ===
            'number'
        ) {

            octaveShift =
                Math.max(
                    -1,
                    Math.min(
                        2,
                        settings.octave
                    )
                );


            updateKeyboardMap();

        }


        if (
            settings.bpm
        ) {

            practiceBPM =
                settings.bpm;


            practiceBPMInput.value =
                settings.bpm;


            practiceBPMValue.textContent =
                settings.bpm;

        }

    }

    catch (_) {}

}


/* =========================================================
   AUTO SAVE SETTINGS
========================================================= */

[
    'instrument',
    'volume',
    'reverb'
]
.forEach(
    id => {

        $(id)
            .addEventListener(
                'change',
                saveSettings
            );

        $(id)
            .addEventListener(
                'input',
                saveSettings
            );

    }
);


/* =========================================================
   SAVE OCTAVE
========================================================= */

$('octDown')
    .addEventListener(
        'click',
        saveSettings
    );


$('octUp')
    .addEventListener(
        'click',
        saveSettings
    );


/* =========================================================
   KEYBOARD SHORTCUTS
========================================================= */

window.addEventListener(
    'keydown',
    event => {

        if (
            event.ctrlKey ||
            event.metaKey ||
            event.altKey
        ) {

            return;

        }


        /* -----------------------------------------------
           R = RECORD
        ----------------------------------------------- */

        if (
            event.key.toLowerCase() ===
            'r'
        ) {

            if (
                event.target.tagName ===
                'INPUT'
            ) {

                return;

            }


            if (
                !event.repeat
            ) {

                $('record').click();

            }


            return;

        }


        /* -----------------------------------------------
           M = METRONOME
        ----------------------------------------------- */

        if (
            event.key.toLowerCase() ===
            'm'
        ) {

            if (
                !event.repeat
            ) {

                $('metronome').click();

            }


            return;

        }


        /* -----------------------------------------------
           P = PLAY RECORDING
        ----------------------------------------------- */

        if (
            event.key.toLowerCase() ===
            'p'
        ) {

            if (
                !event.repeat &&
                !recording
            ) {

                $('play').click();

            }


            return;

        }


        /* -----------------------------------------------
           ESCAPE = PANIC
        ----------------------------------------------- */

        if (
            event.key ===
            'Escape'
        ) {

            panicStop();

        }

    }
);


/* =========================================================
   PERFORMANCE PANEL REFRESH
========================================================= */

setInterval(
    () => {

        updatePerformanceStats();

    },
    250
);


/* =========================================================
   INITIAL SETTINGS
========================================================= */

loadSettings();


/* =========================================================
   INITIAL AUDIO MIX
========================================================= */

function refreshAudioMix() {

    if (
        audioContext &&
        masterGain
    ) {

        updateMix();

    }

}


setTimeout(
    refreshAudioMix,
    100
);


/* =========================================================
   MOBILE TOUCH SAFETY
========================================================= */

document.addEventListener(
    'touchstart',
    event => {

        if (
            event.target.closest(
                '.key'
            )
        ) {

            event.preventDefault();

        }

    },
    {
        passive: false
    }
);


/* =========================================================
   PREVENT ACCIDENTAL PAGE SCROLL
========================================================= */

document.addEventListener(
    'gesturestart',
    event => {

        event.preventDefault();

    }
);


/* =========================================================
   FINAL CLEANUP
========================================================= */

window.addEventListener(
    'beforeunload',
    () => {

        stopMetronome();


        stopPlayback();


        releaseEverything();


        saveSettings();

    }
);


/* =========================================================
   FINAL APPLICATION STATUS
========================================================= */

$('statusText')
    .textContent =
    'Virtual Piano Pro X';


/* =========================================================
   PART 5 COMPLETE
========================================================= */


})();

</script>

</body>

</html>
